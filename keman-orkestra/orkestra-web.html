<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aşk Masalı · Orkestra Eşlik</title>

<style>
:root{--bg:#f4c23f;--ink:#14163a;--card:#fffdf6;--mut:#6b6450;--acc:#14163a;--hl:rgba(20,22,58,.10);--cur:#e2463b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding-bottom:190px}
header{padding:18px 16px 6px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
h1 span{display:block;font-size:15px;font-weight:600;opacity:.75;margin-top:4px}
.modes{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.chip{flex:0 0 auto;background:#fff6;border:1.5px solid var(--ink);border-radius:999px;padding:8px 13px;font:700 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.info{margin:4px 16px 10px;font-size:13px;line-height:1.45;background:#fff8;border-radius:12px;padding:10px 12px}
.sheet{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 10px;background:var(--card);border-radius:16px;padding:8px 6px;box-shadow:0 10px 30px #0002}
#inner{width:var(--z,100%)}.sys{position:relative;margin:2px 0}
.sys img{width:100%;display:block}
.mbox{position:absolute;top:22%;bottom:12%;border-radius:8px;cursor:pointer}
.mbox.act{background:var(--hl);outline:2px solid #14163a55}
.mbox.loopA{box-shadow:inset 4px 0 0 #2e9d5b}.mbox.loopB{box-shadow:inset -4px 0 0 #2e9d5b}
.mbox.inloop{background:rgba(46,157,91,.10)}
.cursor{position:absolute;top:18%;bottom:8%;width:3px;background:var(--cur);border-radius:2px;display:none;box-shadow:0 0 8px var(--cur);pointer-events:none}
.sysl{position:absolute;left:6px;top:2px;font:800 10px Inter;color:#9a8f6a;letter-spacing:.5px}
.dock{position:fixed;left:8px;right:8px;bottom:8px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 10px 30px #0005}
.row{display:flex;align-items:center;gap:10px}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:24px;font-weight:800;cursor:pointer;flex:0 0 auto}
.tempo{flex:1}
.tempo .lab{display:flex;justify-content:space-between;font-size:12px;opacity:.8}
.tempo b{font-size:20px}
input[type=range]{width:100%;accent-color:var(--bg)}
.mix{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.mix button{flex:0 0 auto;background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:7px 10px;font:600 12px Inter;cursor:pointer}
.mix button.on{background:#fff;color:var(--ink)}
.stat{font-size:12px;opacity:.85;margin-top:8px;min-height:16px;display:flex;justify-content:space-between;gap:8px}
.tap{display:none;margin-top:10px;width:100%;height:64px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);font:800 18px Inter;cursor:pointer}
.mic{display:none;margin-top:8px;height:8px;background:#ffffff20;border-radius:4px;overflow:hidden}
.mic i{display:block;height:100%;width:0;background:#4fd18b;transition:width .05s}
.note{font:800 14px Inter;color:var(--bg)}
select{background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:7px;font:600 12px Inter}
select option{color:#000}
</style>
</head>
<body>
<header><h1>Sen çal.<br>Orkestra seninle çalsın.<span>Aşk Masalı · Nihavend · Sofyan · ~84 BPM orijinal</span></h1></header>
<div class="modes" id="modes">
<button class="chip on" data-m="fixed">⏱ Sabit tempo</button>
<button class="chip" data-m="tap">👆 Dokun-takip</button>
<button class="chip" data-m="mic">🎙 Beni dinle</button>
<button class="chip" id="zoom">🔍 Büyüt</button>
</div>
<div class="info" id="info"></div>
<div class="sheet" id="sheetW"><div id="inner"></div></div>

<div class="dock">
<div class="row">
<button class="play" id="play">▶</button>
<div class="tempo"><div class="lab"><span>Tempo</span><span><b id="tv">60</b> BPM</span></div>
<input type="range" id="tempo" min="30" max="120" step="2" value="60"></div>
</div>
<button class="tap" id="tap">VURUŞ ● (boşluk tuşu)</button>
<div class="mic" id="micbar"><i></i></div>
<div class="mix">
<select id="part"><option value="all">Tüm şarkı</option><option value="saz">Saz</option><option value="zemin">Zemin (Aşkım…)</option><option value="b">B (Kalbim…)</option><option value="nak">Nakarat</option><option value="mey">Meyan</option><option value="loop">A–B seçimi</option></select>
<button id="mel" data-s="1">🎻 Melodi: kılavuz</button>
<button id="real" class="on">🎻 Gerçek ses</button>
<button id="str" class="on">Yaylılar</button>
<button id="kan" class="on">Arp</button>
<button id="bas" class="on">Bas</button>
<button id="drm" class="on">Darbuka</button>
<button id="cnt" class="on">4 say</button>
<button id="rep">🔁</button>
</div>
<div class="stat"><span id="st">Notaya dokun: oradan başlar. İki kez dokun: A–B döngü.</span><span class="note" id="hn"></span></div>
</div>

 if(f){const mf=69+12*Math.log2(f/440);const mr=Math.round(mf);if(mr===lastMidi)stableN++;else{stableN=1;lastMidi=mr;onset=true}
  $('hn').textContent=(NM[mr]||'·')+(Math.abs(mf-mr)>.25?(mf>mr?' ↑':' ↓'):' ✓');
  if(stableN===2||(onset&&stableN>=2)){for(let k=0;k<3&&micPtr+k<TL.expect.length;k++){const e=TL.expect[micPtr+k];
    if(Math.abs(mf-e.midi)<.6){const same=k===0&&micPtr>0&&TL.expect[micPtr-1].midi===e.midi;if(same&&!onset&&now-lastOnsetT<.15)break;
     matchNote(micPtr+k,now);break}}}
 }else{lastMidi=null;stableN=0}
 if(onset)lastOnsetT=now;micRaf=requestAnimationFrame(micLoop)}
function matchNote(i,t){const e=TL.expect[i];micPtr=i+1;micPos=e.beat;matchHist.push({t,beat:e.beat});if(matchHist.length>6)matchHist.shift();
 if(matchHist.length>=3){const a=matchHist[0],b=matchHist[matchHist.length-1];const db=b.beat-a.beat;if(db>=1){const est=(b.t-a.t)/db;if(est>.3&&est<2.2)spb=spb*.6+est*.4}}
 $('tv').textContent=Math.round(60/spb);
 if(!micStarted){micStarted=true;const bt=Math.floor(e.beat);bi=TL.beats.findIndex(B=>B.g===bt);nextT=t-(e.beat-bt)*spb;if(nextT<AC.currentTime)nextT=AC.currentTime+.01;$('st').textContent='Birlikte çalıyoruz 🎻'}}
// ===== ekran =====
let curBox=null;
function draw(){if(!AC||!playing){return}const now=AC.currentTime;while(uiQ.length>1&&uiQ[1].t<=now)uiQ.shift();const q=uiQ[0];
 if(q&&q.t<=now){const B=q.B,bx=BOX[B.m];if(bx){if(curBox!==bx){if(curBox){curBox.el.classList.remove('act');curBox.sys.querySelector('.cursor').style.display='none'}bx.el.classList.add('act');curBox=bx;
   const r=bx.sys.getBoundingClientRect();if(r.top<20||r.bottom>innerHeight-200)bx.sys.scrollIntoView({block:'center',behavior:'smooth'})}
  const fr=Math.min(1,(now-q.t)/q.s);const pos=(B.b+fr)/4;const c=bx.sys.querySelector('.cursor');c.style.display='block';const lx=bx.L+(bx.R-bx.L)*(.04+.92*pos);c.style.left=(lx*100)+'%';const px=lx*sheet.offsetWidth;if(px<sheetW.scrollLeft+30||px>sheetW.scrollLeft+sheetW.clientWidth-60)sheetW.scrollLeft=px-sheetW.clientWidth*.3;
  if(mode!=='mic')$('st').textContent=`${B.m}. ölçü · ${B.b+1}. vuruş · ${B.chord}`}}
 raf=requestAnimationFrame(draw)}
setMode('fixed');setZ();
</script>
