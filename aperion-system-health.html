<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AperiON Sistem Sağlığı</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#08111f;color:#edf4ff;margin:0;padding:28px}
    main{max-width:900px;margin:auto}h1{margin-bottom:6px}.sub{color:#94a7c4;margin-top:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}
    article{background:#111d31;border:1px solid #263a5a;border-radius:14px;padding:18px}
    .state{font-weight:800}.healthy{color:#52d6a0}.blocked{color:#ff7e8b}.loading{color:#f5c75f}
    pre{white-space:pre-wrap;word-break:break-word;color:#afbed4;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>AperiON Sistem Sağlığı</h1>
    <p class="sub">Bu sayfa yalnızca servis durumunu gösterir; korumalı işletme verisini açmaz.</p>
    <section class="grid" id="grid"></section>
  </main>
  <script>
    const services = [
      {name:'Oturum Hafızası',url:'/api/session-bootstrap?health=1'},
      {name:'Masaüstü Cihaz Köprüsü',url:'/api/device/health'},
      {name:'Telegram Komut Merkezi',url:'/telegram/webhook'}
    ];
    const grid=document.getElementById('grid');
    const cards=services.map((service)=>{
      const article=document.createElement('article');
      article.innerHTML=`<h2>${service.name}</h2><div class="state loading">Kontrol ediliyor…</div><pre></pre>`;
      grid.appendChild(article);
      return {service,article};
    });
    Promise.all(cards.map(async ({service,article})=>{
      const state=article.querySelector('.state');
      const detail=article.querySelector('pre');
      try{
        const response=await fetch(service.url,{cache:'no-store'});
        const body=await response.json();
        const healthy=response.ok&&body.ok;
        state.className=`state ${healthy?'healthy':'blocked'}`;
        state.textContent=healthy?'ÇALIŞIYOR':`ENGELLİ (${response.status})`;
        const safe={...body};
        delete safe.device_token;
        detail.textContent=JSON.stringify(safe,null,2);
      }catch(error){
        state.className='state blocked';state.textContent='OKUNAMADI';
        detail.textContent=String(error.message||error);
      }
    }));
  </script>
</body>
</html>
