name: AperiON Telegram Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-watchdog.yml'
      - 'tools/ensure_telegram_webhook.cjs'
      - 'tools/test_telegram_watchdog_static.cjs'
      - 'tools/test_telegram_watchdog_health.cjs'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: aperion-telegram-watchdog
  cancel-in-progress: false

permissions:
  contents: read

env:
  TELEGRAM_EXPECTED_WEBHOOK_URL: https://aperion-istasyon.pages.dev/telegram/webhook
  TELEGRAM_PREFLIGHT_URL: https://aperion-istasyon.pages.dev/api/telegram-preflight
  TELEGRAM_DROP_PENDING: 'false'

jobs:
  telegram-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Telegram webhook
        env:
          HERMES_TELEGRAM_BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_TOKEN || secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        run: |
          node tools/test_telegram_watchdog_static.cjs
          node tools/test_telegram_watchdog_health.cjs
          node tools/ensure_telegram_webhook.cjs
