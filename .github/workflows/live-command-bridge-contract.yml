name: ApeirON Live Command Bridge Contract

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/test_live_command_bridge_contract_v1.mjs'
      - '.github/workflows/live-command-bridge-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live command bridge contract
        run: node tools/test_live_command_bridge_contract_v1.mjs
