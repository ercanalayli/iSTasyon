name: BizimHesap to ODE Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bizimhesap-ode-live-mirror.yml'
      - 'tools/sync_bizimhesap_ode.mjs'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write # OIDC: short-lived Google access token, no static Google key

concurrency:
  group: bizimhesap-ode-mirror-prod
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ercanalayli/iSTasyon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      APERION_BRIDGE_SECRET: ${{ secrets.APERION_BRIDGE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate to Google via keyless OIDC (only when configured)
        id: auth_google
        if: ${{ vars.APERION_GCP_WIF_PROVIDER != '' && vars.APERION_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.APERION_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.APERION_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          create_credentials_file: false
      - name: Check required credentials
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth_google.outputs.access_token }}
        run: |
          test -n "$APERION_BRIDGE_SECRET" || { echo "Missing APERION_BRIDGE_SECRET"; exit 1; }
          if [ -z "$GOOGLE_ACCESS_TOKEN" ]; then
            test -n "$GOOGLE_CLIENT_ID" || { echo "Missing GOOGLE_CLIENT_ID"; exit 1; }
            test -n "$GOOGLE_CLIENT_SECRET" || { echo "Missing GOOGLE_CLIENT_SECRET"; exit 1; }
            test -n "$GOOGLE_REFRESH_TOKEN" || { echo "Missing GOOGLE_REFRESH_TOKEN"; exit 1; }
          fi
      - name: Sync source-verified D1 events to BH tabs, never monthly payments
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth_google.outputs.access_token }}
        run: node tools/sync_bizimhesap_ode.mjs
