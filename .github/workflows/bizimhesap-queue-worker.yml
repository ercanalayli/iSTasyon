name: AperiON BizimHesap Queue Worker

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Salt-okunur plan icin maksimum kuyruk kaydi"
        required: false
        default: "1"
  push:
    branches: [ main ]
    paths:
      - 'bizimhesap_queue_worker.cjs'
      - 'bizimhesap_common.cjs'
      - 'tools/bank_posting_plan.cjs'
      - 'automation/sql/002_bizimhesap_queue.sql'
      - 'automation/sql/003_approve_pending_to_queue.sql'
      - 'automation/sql/007_confirm_pending_bank_counterparty.sql'
      - 'automation/sql/000_mail_ekstre_FULL_INSTALL.sql'
      - 'package.json'
      - '.github/workflows/bizimhesap-queue-worker.yml'

jobs:
  queue-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check tools/bank_posting_plan.cjs
          node --check tools/preview_pending_bank_to_bizimhesap_plan.cjs
          node --check bizimhesap_queue_worker.cjs

      - name: Dry-run queue plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPANY_ID: alayli
        run: npm run bizimhesap:queue:dry

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizimhesap-queue-worker
          path: |
            data/bizimhesap_queue_dryrun.json
            bizimhesap_queue_worker.log
            diagnostics/**
          if-no-files-found: ignore
