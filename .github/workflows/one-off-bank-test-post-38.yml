name: One-off Bank Test Post (record 38)

# Tek seferlik: Ercan'in 2026-08-03 onayiyla, %100 guvenli banka hareketi
# #38'i (48,23 TL banka masrafi) gercekten BizimHesap'a isliyor - secret'lar
# burada zaten var, sifre hicbir yerde gorunmuyor. Basarili/basarisiz sonrasi
# bu workflow dosyasi silinecek (tek AperiON, sprawl birakma kurali).
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-bank-test-post-38.yml"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Kayit #38'i BizimHesap'a isle (canli, tek kayit)
        env:
          BIZIMHESAP_EMAIL: ${{ secrets.BIZIMHESAP_EMAIL }}
          BIZIMHESAP_PASSWORD: ${{ secrets.BIZIMHESAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BANK_TABLE: bank_transactions
          BIZIMHESAP_POSTING_LIVE: "1"
          BIZIMHESAP_HEADLESS: "true"
        run: node bizimhesap_banka_bot.cjs --id 38 --limit 1 --commit --save
