name: Bootstrap Secure Free ALKAM Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alkam-secure-cloudflare-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alkam-secure-cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: alkam-mali-v2
      APP_DOMAIN: alkam-mali-v2.pages.dev
      GH_OWNER: ercanalayli
      GH_OWNER_ID: "249922773"
      GH_REPO_ID: "1231933832"
      GH_REPO_NAME: alkam-mali-v2
      GH_BRANCH: master
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Preflight Cloudflare Pages and Access permissions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          pages="$(curl -sS "${auth[@]}" "$api/pages/projects")"
          if [ "$(jq -r '.success // false' <<<"$pages")" != "true" ]; then
            echo "::error::Cloudflare Pages permission preflight failed."
            jq -c '{errors,messages}' <<<"$pages" || true
            exit 1
          fi

          idps="$(curl -sS "${auth[@]}" "$api/access/identity_providers")"
          if [ "$(jq -r '.success // false' <<<"$idps")" != "true" ]; then
            if jq -e '.errors[]? | select((.message // "") | contains("Access is not enabled"))' <<<"$idps" >/dev/null; then
              echo "Zero Trust Access is not enabled yet; attempting free organization setup."
              org_payload="$(jq -nc '{auth_domain:"alkam-59990542.cloudflareaccess.com",name:"ALKAM Zero Trust",session_duration:"24h",deny_unmatched_requests:false,auto_redirect_to_identity:false,allow_authenticate_via_warp:false}')"
              org="$(curl -sS -X POST "${auth[@]}" "$api/access/organizations" --data "$org_payload")"
              if [ "$(jq -r '.success // false' <<<"$org")" != "true" ]; then
                echo "::error::Could not enable free Cloudflare Access organization."
                jq -c '{errors,messages}' <<<"$org" || true
                exit 1
              fi
              idps="$(curl -sS "${auth[@]}" "$api/access/identity_providers")"
            fi
          fi
          if [ "$(jq -r '.success // false' <<<"$idps")" != "true" ]; then
            echo "::error::Cloudflare Access identity-provider permission preflight failed."
            jq -c '{errors,messages}' <<<"$idps" || true
            exit 1
          fi

          apps="$(curl -sS "${auth[@]}" "$api/access/apps")"
          if [ "$(jq -r '.success // false' <<<"$apps")" != "true" ]; then
            echo "::error::Cloudflare Access Apps permission preflight failed."
            jq -c '{errors,messages}' <<<"$apps" || true
            exit 1
          fi
          echo "Pages + Access API permissions verified before any ALKAM deployment."

      - name: Configure fail-closed Cloudflare Access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          idps="$(curl -fsS "${auth[@]}" "$api/access/identity_providers")"
          cf_idp="$(jq -r '.result[]? | select(.type=="cloudflare") | .id' <<<"$idps" | head -n1)"
          if [ -z "$cf_idp" ]; then
            resp="$(curl -fsS -X POST "${auth[@]}" "$api/access/identity_providers" --data '{"name":"ALKAM Cloudflare","type":"cloudflare","config":{"restrict_to_account_members":true}}')"
            test "$(jq -r '.success' <<<"$resp")" = "true"
            cf_idp="$(jq -r '.result.id' <<<"$resp")"
          fi
          test -n "$cf_idp" && test "$cf_idp" != "null"

          apps="$(curl -fsS "${auth[@]}" "$api/access/apps")"
          app_id="$(jq -r --arg d "$APP_DOMAIN" '.result[]? | select(.domain==$d and .type=="self_hosted") | .id' <<<"$apps" | head -n1)"

          if [ -z "$app_id" ]; then
            app_payload="$(jq -nc --arg domain "$APP_DOMAIN" --arg idp "$cf_idp"               '{name:"ALKAM Mali",type:"self_hosted",domain:$domain,session_duration:"24h",app_launcher_visible:false,auto_redirect_to_identity:true,allowed_idps:[$idp]}')"
            resp="$(curl -fsS -X POST "${auth[@]}" "$api/access/apps" --data "$app_payload")"
            test "$(jq -r '.success' <<<"$resp")" = "true"
            app_id="$(jq -r '.result.id' <<<"$resp")"
          fi
          test -n "$app_id" && test "$app_id" != "null"

          policies="$(curl -fsS "${auth[@]}" "$api/access/apps/$app_id/policies")"
          policy_id="$(jq -r '.result[]? | select(.name=="ALKAM Account Members Only") | .id' <<<"$policies" | head -n1)"
          policy_payload="$(jq -nc --arg account "$CF_ACCOUNT_ID"             '{name:"ALKAM Account Members Only",decision:"allow",precedence:1,include:[{cloudflare_account_member:{account_id:$account}}],require:[],exclude:[]}')"

          if [ -z "$policy_id" ]; then
            resp="$(curl -fsS -X POST "${auth[@]}" "$api/access/apps/$app_id/policies" --data "$policy_payload")"
          else
            resp="$(curl -fsS -X PUT "${auth[@]}" "$api/access/apps/$app_id/policies/$policy_id" --data "$policy_payload")"
          fi
          test "$(jq -r '.success' <<<"$resp")" = "true"

          verify="$(curl -fsS "${auth[@]}" "$api/access/apps/$app_id/policies")"
          jq -e --arg account "$CF_ACCOUNT_ID"             '.result[] | select(.name=="ALKAM Account Members Only") | .include[] | select(.cloudflare_account_member.account_id==$account)'             <<<"$verify" >/dev/null

          echo "Access app and account-member policy verified."
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Create or validate Git-backed Pages project in guard mode
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          guard_cmd="rm -rf _cf_dist && mkdir -p _cf_dist && printf '%s\n' '<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"robots\" content=\"noindex,nofollow\"><title>ALKAM Güvenli Yayın</title></head><body>ALKAM güvenlik kapısı hazır.</body></html>' > _cf_dist/index.html && printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Cache-Control: no-store, private\n  X-Content-Type-Options: nosniff\n  X-Frame-Options: DENY\n  Referrer-Policy: no-referrer\n' > _cf_dist/_headers"

          current="$(curl -sS "${auth[@]}" "$api/pages/projects/$PROJECT_NAME")"
          if [ "$(jq -r '.success // false' <<<"$current")" = "true" ]; then
            current_repo="$(jq -r '.result.source.config.repo_id // empty' <<<"$current")"
            if [ -n "$current_repo" ] && [ "$current_repo" != "$GH_REPO_ID" ]; then
              echo "::error::Existing Cloudflare Pages project is linked to a different repository; refusing to mutate it."
              exit 1
            fi
            patch="$(jq -nc --arg cmd "$guard_cmd"               '{build_config:{build_command:$cmd,destination_dir:"_cf_dist"}}')"
            resp="$(curl -fsS -X PATCH "${auth[@]}" "$api/pages/projects/$PROJECT_NAME" --data "$patch")"
            test "$(jq -r '.success' <<<"$resp")" = "true"
          else
            payload="$(jq -nc               --arg name "$PROJECT_NAME" --arg branch "$GH_BRANCH"               --arg owner "$GH_OWNER" --arg owner_id "$GH_OWNER_ID"               --arg repo_id "$GH_REPO_ID" --arg repo_name "$GH_REPO_NAME"               --arg cmd "$guard_cmd"               '{name:$name,production_branch:$branch,build_config:{build_command:$cmd,destination_dir:"_cf_dist"},source:{type:"github",config:{owner:$owner,owner_id:$owner_id,repo_id:$repo_id,repo_name:$repo_name,production_branch:$branch,production_deployments_enabled:false,preview_deployment_setting:"none",pr_comments_enabled:false}}}')"
            resp="$(curl -sS -X POST "${auth[@]}" "$api/pages/projects" --data "$payload")"
            if [ "$(jq -r '.success // false' <<<"$resp")" != "true" ]; then
              echo "::error::Could not create Git-backed Pages project. Cloudflare GitHub App may not yet have access to the private ALKAM repository."
              jq -c '{errors,messages}' <<<"$resp" || true
              exit 1
            fi
          fi

          project="$(curl -fsS "${auth[@]}" "$api/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$project")" = "true"
          test "$(jq -r '.result.source.config.repo_id' <<<"$project")" = "$GH_REPO_ID"
          echo "Guard-mode Pages project is linked to the private ALKAM repository."

      - name: Deploy harmless guard from private repository
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN")
          resp="$(curl -sS -X POST "${auth[@]}" "$api/pages/projects/$PROJECT_NAME/deployments" -F "branch=$GH_BRANCH")"
          if [ "$(jq -r '.success // false' <<<"$resp")" != "true" ]; then
            echo "::error::Guard deployment could not start."
            jq -c '{errors,messages}' <<<"$resp" || true
            exit 1
          fi
          dep_id="$(jq -r '.result.id' <<<"$resp")"
          test -n "$dep_id" && test "$dep_id" != "null"

          for i in $(seq 1 90); do
            dep="$(curl -fsS "${auth[@]}" "$api/pages/projects/$PROJECT_NAME/deployments/$dep_id")"
            status="$(jq -r '.result.latest_stage.status // empty' <<<"$dep")"
            if [ "$status" = "success" ]; then
              echo "Guard deployment succeeded."
              echo "deployment_id=$dep_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failure" ] || [ "$status" = "canceled" ]; then
              echo "::error::Guard deployment failed with status $status."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Guard deployment timed out."
          exit 1

      - name: Verify anonymous requests hit Access before ALKAM exists
        shell: bash
        run: |
          set -euo pipefail
          url="https://$APP_DOMAIN/"
          curl -sS -D /tmp/headers -o /tmp/body "$url" || true
          code="$(awk 'NR==1{print $2}' /tmp/headers)"
          location="$(awk -F': ' 'tolower($1)=="location"{print $2}' /tmp/headers | tr -d '\r' | head -n1 || true)"
          if [ "$code" = "200" ]; then
            echo "::error::FAIL-CLOSED: anonymous request returned 200. ALKAM will NOT be deployed."
            exit 1
          fi
          if ! grep -qiE 'cloudflareaccess|/cdn-cgi/access' <<<"$location" && ! grep -qiE 'cloudflare access|cloudflareaccess|/cdn-cgi/access' /tmp/body; then
            echo "::error::FAIL-CLOSED: Access login boundary was not positively verified (HTTP $code). ALKAM will NOT be deployed."
            exit 1
          fi
          echo "Anonymous access is blocked by Cloudflare Access (HTTP $code)."

      - name: Switch build to exact latest ALKAM release
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          release_cmd="set -eu; latest=\$(find release -maxdepth 1 -type f -name 'ALKAM_*.html' | sort | tail -n1); test -n \"\$latest\"; rm -rf _cf_dist; mkdir -p _cf_dist; cp \"\$latest\" _cf_dist/index.html; printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Cache-Control: no-store, private\n  X-Content-Type-Options: nosniff\n  X-Frame-Options: DENY\n  Referrer-Policy: no-referrer\n  Permissions-Policy: camera=(), geolocation=(), payment=(), usb=()\n' > _cf_dist/_headers"
          patch="$(jq -nc --arg cmd "$release_cmd"             '{build_config:{build_command:$cmd,destination_dir:"_cf_dist"}}')"
          resp="$(curl -fsS -X PATCH "${auth[@]}" "$api/pages/projects/$PROJECT_NAME" --data "$patch")"
          test "$(jq -r '.success' <<<"$resp")" = "true"
          echo "Project switched to latest release build after Access verification."

      - name: Deploy protected ALKAM
        id: final
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN")
          resp="$(curl -sS -X POST "${auth[@]}" "$api/pages/projects/$PROJECT_NAME/deployments" -F "branch=$GH_BRANCH")"
          if [ "$(jq -r '.success // false' <<<"$resp")" != "true" ]; then
            echo "::error::Protected ALKAM deployment could not start."
            jq -c '{errors,messages}' <<<"$resp" || true
            exit 1
          fi
          dep_id="$(jq -r '.result.id' <<<"$resp")"
          for i in $(seq 1 90); do
            dep="$(curl -fsS "${auth[@]}" "$api/pages/projects/$PROJECT_NAME/deployments/$dep_id")"
            status="$(jq -r '.result.latest_stage.status // empty' <<<"$dep")"
            if [ "$status" = "success" ]; then
              url="$(jq -r '.result.url // empty' <<<"$dep")"
              echo "Protected ALKAM deployment succeeded: $url"
              echo "deployment_id=$dep_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failure" ] || [ "$status" = "canceled" ]; then
              echo "::error::Protected ALKAM deployment failed with status $status."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Protected ALKAM deployment timed out."
          exit 1

      - name: Final fail-closed verification
        shell: bash
        run: |
          set -euo pipefail
          url="https://$APP_DOMAIN/"
          curl -sS -D /tmp/final-headers -o /tmp/final-body "$url" || true
          code="$(awk 'NR==1{print $2}' /tmp/final-headers)"
          location="$(awk -F': ' 'tolower($1)=="location"{print $2}' /tmp/final-headers | tr -d '\r' | head -n1 || true)"
          if [ "$code" = "200" ]; then
            echo "::error::CRITICAL: protected ALKAM is anonymously readable."
            exit 1
          fi
          if ! grep -qiE 'cloudflareaccess|/cdn-cgi/access' <<<"$location" && ! grep -qiE 'cloudflare access|cloudflareaccess|/cdn-cgi/access' /tmp/final-body; then
            echo "::error::CRITICAL: final Access boundary was not positively verified."
            exit 1
          fi
          echo "FINAL OK: ALKAM is live behind Cloudflare Access at https://$APP_DOMAIN/"

      - name: Enable automatic production updates only after verified protection
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          patch="$(jq -nc             --arg owner "$GH_OWNER" --arg owner_id "$GH_OWNER_ID"             --arg repo_id "$GH_REPO_ID" --arg repo_name "$GH_REPO_NAME" --arg branch "$GH_BRANCH"             '{source:{type:"github",config:{owner:$owner,owner_id:$owner_id,repo_id:$repo_id,repo_name:$repo_name,production_branch:$branch,production_deployments_enabled:true,preview_deployment_setting:"none",pr_comments_enabled:false}}}')"
          resp="$(curl -fsS -X PATCH "${auth[@]}" "$api/pages/projects/$PROJECT_NAME" --data "$patch")"
          test "$(jq -r '.success' <<<"$resp")" = "true"
          echo "Future master updates will deploy automatically; preview deployments remain off."
