name: AperiON Cloudflare Permission Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aperion-cloudflare-permission-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment token capabilities (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "AUDIT: Missing Cloudflare repo credentials"
            exit 1
          fi
          URL="https://api.cloudflare.com/client/v4"
          token_headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")
          verify=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${token_headers[@]}" "$URL/user/tokens/verify")
          account=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${token_headers[@]}" "$URL/accounts/$CLOUDFLARE_ACCOUNT_ID")
          workers=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${token_headers[@]}" "$URL/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          pages=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${token_headers[@]}" "$URL/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          echo "CLOUDFLARE_TOKEN_VERIFY_HTTP=$verify"
          echo "CLOUDFLARE_ACCOUNT_ACCESS_HTTP=$account"
          echo "CLOUDFLARE_WORKERS_LIST_HTTP=$workers"
          echo "CLOUDFLARE_PAGES_LIST_HTTP=$pages"
          echo "SENSITIVE_VALUES_NOT_PRINTED=true"
