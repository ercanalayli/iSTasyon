name: ApeirON Operations Read-Only Smoke

on:
  workflow_run:
    workflows: ["Deploy AperiON Cloudflare Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  health:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live read-only operations endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 10 --retry 8 --retry-delay 5 --retry-all-errors \
            'https://aperion-istasyon.pages.dev/api/aperion-operations?health=1')"
          printf '%s' "$body" | jq -e '.ok == true and .service == "aperion-operations" and .version == "v1" and .data_access == "protected"' >/dev/null
          echo 'APERION_OPERATIONS_HEALTH=PASS'

      - name: Verify protected source-backed report without external writes
        shell: bash
        env:
          APERION_BRIDGE_SECRET: ${{ secrets.APERION_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APERION_BRIDGE_SECRET"
          body="$(curl --fail --silent --show-error --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $APERION_BRIDGE_SECRET" \
            'https://aperion-istasyon.pages.dev/api/aperion-operations')"
          printf '%s' "$body" | jq -e '.ok == true and .read_only == true and .financial_writes == false and
            .notifications.delivery_enabled == false and .notifications.status == "candidates_only" and
            .operating_mode == "bizimhesap_read_only_user_manual_entry" and
            (.reporting.status | type == "string") and (.procurement.status | type == "string") and
            (.marketing.status | type == "string")' >/dev/null
          printf '%s' "$body" | jq -r '"REPORTING_STATUS=" + .reporting.status,
            "PROCUREMENT_STATUS=" + .procurement.status,
            "MARKETING_STATUS=" + .marketing.status,
            "FINANCIAL_WRITES=false", "NOTIFICATIONS_SENT=false"'
