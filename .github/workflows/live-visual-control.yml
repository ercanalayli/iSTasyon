name: Live Visual Control

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index*.html'
      - 'final.html'
      - 'dev.html'
      - 'aperion-*.html'
      - 'functions/**'
      - 'tools/live_visual_control_bot.cjs'
      - '.github/workflows/live-visual-control.yml'

jobs:
  visual-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wait for Cloudflare deploy
        run: sleep 45

      - name: Run visual control bot
        run: node tools/live_visual_control_bot.cjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-visual-control
          path: artifacts/live-visual-control
          if-no-files-found: ignore
