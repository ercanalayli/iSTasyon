name: AperiON Cari Bakiye Sync

# Gunde bir kez BizimHesap musteri listesindeki acik bakiyeleri (5700+
# cari) tarayip public.customers tablosuna yazan komutu kuyruga ekler.
# Gercek tarama isini yerel Hermes dinleyicisi yapar.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cari-bakiye-sync.yml"
      - "tools/kuyruk_cari_bakiye_sync.cjs"
      - "tools/kuyruk_bizimhesap_read_sync_common.cjs"
  schedule:
    # 06:30 Europe/Istanbul (UTC+3)
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APERION_QUEUE_WAIT_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run cari:bakiye:sync:queue
