name: Inspect Cloudflare Pages List

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cloudflare-pages-list.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List project names safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          resp="$(curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "$api/pages/projects")"
          test "$(jq -r '.success // false' <<<"$resp")" = "true"
          jq -c '[.result[] | {name,subdomain,production_branch,repo_name:(.source.config.repo_name // null),repo_id:(.source.config.repo_id // null),owner:(.source.config.owner // null)}]' <<<"$resp"
