name: Deploy AperiON Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aperion-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish canonical dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy main to canonical Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: pages deploy . --project-name=aperion-istasyon --branch=main --commit-dirty=true

      - name: Verify root A1 path with iPhone Safari UA
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          curl -A "$UA" -fsSL --retry 10 --retry-delay 3 --retry-all-errors \
            -D /tmp/a1-headers.txt \
            https://aperion-istasyon.pages.dev/a1.html \
            -o /tmp/a1-live.html
          test "$(wc -c < /tmp/a1-live.html)" -gt 5000
          grep -qi '^content-type: text/html' /tmp/a1-headers.txt
          grep -q 'ApeirON Control Center' /tmp/a1-live.html
          grep -q 'Günün tamamı tek kontrol yüzeyinde' /tmp/a1-live.html
          echo "APERION_A1_IPHONE_VERIFY=PASS"
