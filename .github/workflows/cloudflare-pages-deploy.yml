name: Deploy AperiON Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aperion-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish canonical dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy main to canonical Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: pages deploy . --project-name=aperion-istasyon --branch=main --commit-dirty=true

      - name: Verify control path
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors \
            https://aperion-istasyon.pages.dev/control/ -o /tmp/aperion-control.html
          test "$(wc -c < /tmp/aperion-control.html)" -gt 5000
          grep -q 'ApeirON Control Center' /tmp/aperion-control.html
          grep -q 'Günün tamamı tek kontrol yüzeyinde' /tmp/aperion-control.html
          echo "APERION_CONTROL_PATH_VERIFY=PASS"
