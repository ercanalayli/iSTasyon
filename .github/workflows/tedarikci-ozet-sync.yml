name: AperiON Tedarikci Ozet Sync

# Gunde bir kez BizimHesap Alislar listesindeki tedarikci bazli satin alma
# hacmini (son 3 ay) tarayip public.supplier_purchase_summary tablosuna
# yazan komutu kuyruga ekler. Gercek tarama isini yerel Hermes dinleyicisi yapar.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tedarikci-ozet-sync.yml"
      - "tools/kuyruk_tedarikci_ozet_sync.cjs"
      - "tools/kuyruk_bizimhesap_read_sync_common.cjs"
  schedule:
    # 06:40 Europe/Istanbul (UTC+3) - cari senkrondan 10 dk sonra
    - cron: '40 3 * * *'

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APERION_QUEUE_WAIT_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run tedarikci:ozet:sync:queue
