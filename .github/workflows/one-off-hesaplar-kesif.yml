name: One-off Hesaplar Kesif (BizimHesap accounts page)

# Tek seferlik: Ercan'in istegi - "kredi karti, KMH, banka hesabi ve kredileri
# BizimHesap'tan alabilirsin". Bu is hicbir sey YAZMIYOR, sadece BizimHesap'in
# Nakit Yonetimi > Hesaplar sayfasinin gercek yapisini (kolonlar, hesap tipleri)
# log'a basiyor - gercek yapiyi gordukten sonra duzgun bir scraper yazilacak.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-hesaplar-kesif.yml"

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore BizimHesap session cache
        uses: actions/cache/restore@v4
        with:
          path: .bizimhesap-profile
          key: bizimhesap-session-alayli-${{ github.run_id }}
          restore-keys: |
            bizimhesap-session-alayli-
      - name: Prepare BizimHesap profile dir
        run: mkdir -p .bizimhesap-profile
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Hesaplar sayfasini kesfet
        env:
          BIZIMHESAP_EMAIL: ${{ secrets.BIZIMHESAP_EMAIL }}
          BIZIMHESAP_PASSWORD: ${{ secrets.BIZIMHESAP_PASSWORD }}
          BIZIMHESAP_HEADLESS: "true"
          BIZIMHESAP_PROFILE_DIR: .bizimhesap-profile
        run: node bizimhesap_hesaplar_kesif.cjs
      - name: Save BizimHesap session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bizimhesap-profile
          key: bizimhesap-session-alayli-${{ github.run_id }}
