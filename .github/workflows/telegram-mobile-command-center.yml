name: AperiON Telegram Mobile Command Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-mobile-command-center.yml'

permissions:
  contents: read

concurrency:
  group: aperion-telegram-mobile-command-center
  cancel-in-progress: false

jobs:
  install:
    name: Install secure mobile command center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HERMES_TELEGRAM_BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HERMES_TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_ALLOWED_CHAT_IDS"

      - name: Install pinned Wrangler
        shell: bash
        run: npm install --no-save --ignore-scripts wrangler@4.50.0

      - name: Prepare stable webhook secret
        shell: bash
        run: |
          WEBHOOK_SECRET="$(printf '%s' 'aperion-telegram-webhook-v2' | openssl dgst -sha256 -hmac "$HERMES_TELEGRAM_BOT_TOKEN" | awk '{print $2}')"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Sync command bridge Telegram secrets
        shell: bash
        run: |
          printf '%s' "$HERMES_TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --name aperion-command-bridge
          printf '%s' "$TELEGRAM_ALLOWED_CHAT_IDS" | npx wrangler secret put TELEGRAM_ALLOWED_USERS --name aperion-command-bridge
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --name aperion-command-bridge

      - name: Register command bridge Telegram webhook
        shell: bash
        run: |
          expected_url="https://aperion-command-bridge.yenicespor-finans.workers.dev/telegram/webhook"
          for attempt in 1 2 3; do
            response="$(curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "url=$expected_url" \
              --data-urlencode "secret_token=$WEBHOOK_SECRET" \
              "https://api.telegram.org/bot${HERMES_TELEGRAM_BOT_TOKEN}/setWebhook")"
            printf '%s' "$response" | jq -e '.ok == true' >/dev/null
            sleep 2
            info="$(curl --fail --silent --show-error \
              "https://api.telegram.org/bot${HERMES_TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
            if printf '%s' "$info" | jq -e --arg expected "$expected_url" \
              '.ok == true and .result.url == $expected and (.result.last_error_message // "") == ""' >/dev/null; then
              exit 0
            fi
          done
          printf '%s' "$info" | jq '{ok, result: {url: .result.url, pending_update_count: .result.pending_update_count, last_error_message: .result.last_error_message}}'
          exit 1

      - name: Verify deployed secret and allowlist end-to-end
        shell: bash
        run: |
          TEST_CHAT_ID="$(printf '%s' "$TELEGRAM_ALLOWED_CHAT_IDS" | tr ',;' '  ' | awk '{print $1}')"
          test -n "$TEST_CHAT_ID"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-telegram-bot-api-secret-token: $WEBHOOK_SECRET" \
            --data "{\"update_id\":0,\"message\":{\"message_id\":0,\"from\":{\"id\":$TEST_CHAT_ID},\"chat\":{\"id\":$TEST_CHAT_ID,\"type\":\"private\"}}}" \
            https://aperion-command-bridge.yenicespor-finans.workers.dev/telegram/webhook)"
          printf '%s' "$response" | jq -e '.ok == true and .ignored == true' >/dev/null

      - name: Verify live webhook registration
        shell: bash
        run: |
          info="$(curl --fail --silent --show-error \"https://api.telegram.org/bot${HERMES_TELEGRAM_BOT_TOKEN}/getWebhookInfo\")"
          printf '%s' "$info" | jq -e '.ok == true and .result.url == "https://aperion-command-bridge.yenicespor-finans.workers.dev/telegram/webhook" and (.result.last_error_message // "") == ""' >/dev/null
