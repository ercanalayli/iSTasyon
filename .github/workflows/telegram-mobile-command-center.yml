name: AperiON Telegram Mobile Command Center

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aperion-telegram-mobile-command-center
  cancel-in-progress: false

jobs:
  install:
    name: Install secure mobile command center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TELEGRAM_BOT_TOKEN"

      - name: Install pinned Wrangler
        shell: bash
        run: npm install --no-save --ignore-scripts wrangler@4.50.0

      - name: Prepare one-time webhook secret
        shell: bash
        run: |
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Rotate Pages webhook secret
        shell: bash
        run: |
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler pages secret put TELEGRAM_WEBHOOK_SECRET --project-name aperion-istasyon

      - name: Deploy hardened Pages functions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aperion-istasyon --branch=main --commit-dirty=true

      - name: Register hardened Telegram webhook
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "url=https://aperion-istasyon.pages.dev/telegram/webhook" \
            --data-urlencode "secret_token=$WEBHOOK_SECRET" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")"
          printf '%s' "$response" | jq -e '.ok == true' >/dev/null

      - name: Verify live security status
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error https://aperion-istasyon.pages.dev/telegram/webhook)"
          printf '%s' "$response" | jq -e '
            .ok == true and
            .mode == "mobile-command-center-v2" and
            .identity_guard_configured == true and
            .webhook_secret_configured == true
          ' >/dev/null
