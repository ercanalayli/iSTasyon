name: AperiON approved normal sales workflow
on:
  pull_request:
    paths:
      - 'functions/shared/gamze-normal-sale-proposal.js'
      - 'functions/shared/approved-normal-sale-engine.js'
      - 'tools/test_gamze_normal_sale_proposal.mjs'
      - 'tools/test_approved_normal_sale_engine.mjs'
      - 'tools/test_a2_normal_sale_readback.mjs'
      - 'tools/test_a2_owner_sale_review.mjs'
      - 'functions/api/a2-sale-review.js'
      - 'a2-satis.html'
      - 'aperion-merkez.html'
      - 'functions/shared/a2-normal-sale-readback.js'
      - '.github/workflows/gamze-sale-proposal-tests.yml'
  workflow_dispatch:
jobs:
  approved-normal-sale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Gamze signed-off proposal
        run: node tools/test_gamze_normal_sale_proposal.mjs
      - name: Generic reusable normal sale engine
        run: node tools/test_approved_normal_sale_engine.mjs
      - name: A2 ERP candidate readback guard (no writes)
        run: node tools/test_a2_normal_sale_readback.mjs
      - name: A2 owner-only review / no-post tests
        run: node tools/test_a2_owner_sale_review.mjs
      - name: Source syntax
        run: |
          node --check functions/shared/approved-normal-sale-engine.js
          node --check functions/shared/gamze-normal-sale-proposal.js
          node --check functions/shared/a2-normal-sale-readback.js
          node --check functions/api/a2-sale-review.js
