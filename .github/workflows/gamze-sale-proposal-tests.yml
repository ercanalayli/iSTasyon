name: AperiON Gamze normal sales proposal
on:
  pull_request:
    paths:
      - 'functions/shared/gamze-normal-sale-proposal.js'
      - 'tools/test_gamze_normal_sale_proposal.mjs'
      - '.github/workflows/gamze-sale-proposal-tests.yml'
  workflow_dispatch:
jobs:
  gamze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_gamze_normal_sale_proposal.mjs
      - run: node --check functions/shared/gamze-normal-sale-proposal.js
