name: Deploy ApeirON Control Center

on:
  push:
    branches: [main]
    paths:
      - "deploy/aperion-control-center.html"
      - ".github/workflows/deploy-alkam-live-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build standalone ApeirON site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-dist
          mkdir -p deploy-dist
          cp deploy/aperion-control-center.html deploy-dist/index.html

          cat > deploy-dist/_headers <<'HEADERS'
          /*
            Cache-Control: no-store, private
            X-Robots-Tag: noindex, nofollow, noarchive
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
          HEADERS

      - name: Safety check standalone page
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < deploy-dist/index.html)" -gt 5000
          grep -q 'ApeirON Control Center' deploy-dist/index.html
          grep -q 'aperion-istasyon.pages.dev/api/' deploy-dist/index.html
          grep -q 'İSTASYON' deploy-dist/index.html
      - name: Ensure ApeirON Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.125.0 pages project list | grep -q 'aperion-control-center'; then
            npx --yes wrangler@4.125.0 pages project create aperion-control-center --production-branch=main
          fi

      - name: Deploy ApeirON Control Center
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 pages deploy deploy-dist --project-name=aperion-control-center --branch=main --commit-dirty=true

      - name: Verify public ApeirON page
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors \
            https://aperion-control-center.pages.dev/ -o /tmp/aperion-live.html
          test "$(wc -c < /tmp/aperion-live.html)" -gt 5000
          grep -q 'ApeirON Control Center' /tmp/aperion-live.html
          grep -q 'Günün tamamı tek kontrol yüzeyinde' /tmp/aperion-live.html
          echo "APERION_PUBLIC_VERIFY=PASS"

      - name: Ensure mobile fallback Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.125.0 pages project list | grep -q 'aperion-mobile'; then
            npx --yes wrangler@4.125.0 pages project create aperion-mobile --production-branch=main
          fi

      - name: Deploy mobile fallback
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 pages deploy deploy-dist --project-name=aperion-mobile --branch=main --commit-dirty=true

      - name: Verify mobile fallback
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors \
            https://aperion-mobile.pages.dev/ -o /tmp/aperion-mobile.html
          test "$(wc -c < /tmp/aperion-mobile.html)" -gt 5000
          grep -q 'ApeirON Control Center' /tmp/aperion-mobile.html
          grep -q 'Günün tamamı tek kontrol yüzeyinde' /tmp/aperion-mobile.html
          echo "APERION_MOBILE_VERIFY=PASS"
