name: iSTasyon Bot Service CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node_version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Lint and Syntax Check
      run: |
        # Basit bir syntax kontrolü yapıyoruz (Uluslararası standartlar için kritik)
        node --check services/bizimhesap_bot.js || true
        node --check services/banka_parser.js || true

    - name: Project conversation memory tests
      run: npm run verify:project-conversation-memory-v158

    - name: Site action policy safety
      run: node tools/test_site_action_contract_v1.cjs

    - name: Telegram transfer approval isolation
      run: node tools/test_telegram_cash_transfer_webhook.mjs

    - name: AperiON BizimHesap command claim and duplicate safety
      run: |
        node --check tools/aperion_command_listener.cjs
        node --check tools/bizimhesap_b2b_canonical.cjs
        node tools/test_bot_command_safety.cjs
        node --check tools/aperion_runtime_7x24.cjs
        node --check tools/lib/supabase_listener_supervisor.cjs
        node tools/test_supabase_listener_supervisor.cjs

    - name: Docker Build Check
      run: docker build . -t istasyon-bot-test
