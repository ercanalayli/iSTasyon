name: AperiON BizimHesap API-First Tests
on:
  push:
    branches: [main]
    paths:
      - 'functions/shared/bizimhesap-api-capabilities.js'
      - 'functions/telegram/universal-command-router.js'
      - 'tools/test_bizimhesap_api_first_v163.mjs'
      - 'tools/test_telegram_universal_command_router_v140.mjs'
      - '.github/workflows/aperion-bizimhesap-api-first-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API capability safe routing and all four POST write guards
        run: node tools/test_bizimhesap_api_first_v163.mjs
      - name: Legacy Telegram finance command regression
        run: node tools/test_telegram_universal_command_router_v140.mjs
      - name: Explicit financial write zero
        run: echo "BIZIMHESAP_API_FIRST_TESTS_COMPLETE; REAL_ERP_FINANCIAL_WRITES=0"
