name: AperiON Gmail OAuth Refresh Helper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "start: izin linki uretir, finish: Google code ile refresh token uretir"
        required: true
        default: "start"
        type: choice
        options:
          - start
          - finish
      google_oauth_code:
        description: "Sadece finish modunda Google'in verdigi code"
        required: false
        type: string

jobs:
  gmail-oauth-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_MAILBOX: ercanalayli@gmail.com
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: http://localhost
      GOOGLE_OAUTH_CODE: ${{ inputs.google_oauth_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Diagnose secret (sifreyi acmadan uzunluk/ilk-son karakter)
        run: |
          node -e "
          const id = process.env.GOOGLE_CLIENT_ID || '';
          const sec = process.env.GOOGLE_CLIENT_SECRET || '';
          console.log('CLIENT_ID uzunluk=' + id.length + ' ilk10=' + id.slice(0,10) + ' son10=' + id.slice(-10));
          console.log('CLIENT_ID .apps.googleusercontent.com ile bitiyor mu: ' + id.endsWith('.apps.googleusercontent.com'));
          console.log('CLIENT_SECRET uzunluk=' + sec.length + ' ilk6=' + sec.slice(0,6));
          console.log('CLIENT_SECRET GOCSPX- ile basliyor mu: ' + sec.startsWith('GOCSPX-'));
          "

      - name: Gmail OAuth helper
        run: node automation/gmail-oauth-refresh-helper.cjs "${{ inputs.mode }}"

      - name: Upload OAuth helper artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmail-oauth-helper-output
          path: automation/logs/gmail-*.txt
          if-no-files-found: ignore
