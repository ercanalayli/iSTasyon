name: AperiON Financial Document Catch-up

on:
  push:
    branches: [main]
    paths:
      - 'functions/shared/financial-document.js'
      - 'functions/shared/finance-obligation-memory.js'
      - 'functions/api/financial-document-process.js'
      - 'migrations/0021_finance_obligation_memory.sql'
      - 'workers/aperion-morning-brief/src/index.js'
      - 'functions/telegram/webhook.js'
      - 'wrangler.jsonc'
      - '.github/workflows/financial-document-catchup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-latest-pending-document:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APERION_BRIDGE_SECRET: ${{ secrets.APERION_BRIDGE_SECRET }}
    steps:
      - name: Wait for Pages v157 finance memory health
        run: |
          set -euo pipefail
          endpoint='https://aperion-istasyon.pages.dev/api/financial-document-process'
          ready=''
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$endpoint" | grep -q '"version":"v157"'; then
              ready='yes'
              break
            fi
            sleep 15
          done
          test "$ready" = 'yes'

      - name: Process latest pending capture when authorized
        if: ${{ env.APERION_BRIDGE_SECRET != '' }}
        continue-on-error: true
        run: |
          endpoint='https://aperion-istasyon.pages.dev/api/financial-document-process'
          curl --fail-with-body --silent --show-error -X POST "$endpoint" \
            -H "Authorization: Bearer $APERION_BRIDGE_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}'
